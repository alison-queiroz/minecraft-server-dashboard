name: CI

# Pull-request gate. Each job is a separate required status check so branch
# protection on master can require lint + unit + e2e (+ build) to pass before a
# PR can merge. Also runs on push to master as a post-merge safety net.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Match production (Oracle VM runs Python 3.9); keeps 3.9-only breaks out of
  # main — see tests/test_python39_compat.py and .python-version.
  PYTHON_VERSION: "3.9"

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:strict

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: Frontend unit tests (vitest)
        run: npm test
      - name: Backend unit tests (pytest)
        run: pytest tests/

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e (Angular dev server + local Flask backend)
        env:
          CI: "1"
          # Firebase is optional at boot (ensure_initialized warns and continues),
          # so the API serves for e2e without production credentials.
          AUTO_START_BG_SYNC: "0"
        run: |
          python run.py &
          npx wait-on tcp:5000
          npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build (production)
        run: npx ng build --configuration production
      - name: Pre-compress assets (brotli + gzip)
        run: node scripts/precompress.mjs dist/minecraft-server-dashboard/browser
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/minecraft-server-dashboard/browser
          if-no-files-found: error
          retention-days: 7
