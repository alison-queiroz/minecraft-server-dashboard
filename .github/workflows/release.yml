name: Release

# Build a production bundle and deploy it to the Oracle VM after code lands on
# master. The deploy job only runs when the repo variable ENABLE_GH_DEPLOY is
# "true" AND the ORACLE_* secrets are set — otherwise the workflow just builds
# and uploads the artifact, so it never fails on a repo without deploy creds.
#
# Required to enable server deploys (Settings -> Secrets and variables -> Actions):
#   Variable: ENABLE_GH_DEPLOY = true
#   Secrets:  ORACLE_SSH_PRIVATE_KEY, ORACLE_HOST, ORACLE_USER
#   Optional: ORACLE_KNOWN_HOSTS (else the host key is scanned at deploy time)
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the Oracle VM after build"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Match the Node/npm that generated package-lock.json (npm 11 → Node 24).
  NODE_VERSION: "24"

jobs:
  build:
    name: Build & Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build (production)
        run: npx ng build --configuration production
      - name: Pre-compress assets (brotli + gzip)
        run: node scripts/precompress.mjs dist/minecraft-server-dashboard/browser
      - name: Pack frontend (includes .br/.gz siblings)
        run: tar -czf deploy_build.tar.gz -C dist/minecraft-server-dashboard/browser .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: deploy_build.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: build
    if: >-
      vars.ENABLE_GH_DEPLOY == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    env:
      # Deploy inbox, relative to the SSH user's home (same as deploy.bat).
      REMOTE_INBOX: .dashboard-deploy
    steps:
      - uses: actions/checkout@v7
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: .
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      - name: Add host key
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$ORACLE_KNOWN_HOSTS" ]; then
            echo "$ORACLE_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
      # The server-side steps live in config/remote-deploy.sh, shared with
      # deploy.bat: both pipelines upload the same bundle into the same inbox
      # and run the same phases, so they cannot drift apart.
      - name: Pack backend (api/ + run.py + gunicorn.conf.py)
        run: tar -czf deploy_api.tar.gz --exclude=__pycache__ --exclude='*.pyc' api run.py gunicorn.conf.py
      - name: Upload deploy bundle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh "$ORACLE_USER@$ORACLE_HOST" "mkdir -p $REMOTE_INBOX && chmod 700 $REMOTE_INBOX"
          scp config/remote-deploy.sh config/setup-nginx-map.sh config/setup-nginx-compression.sh \
            deploy_api.tar.gz deploy_build.tar.gz "$ORACLE_USER@$ORACLE_HOST:$REMOTE_INBOX/"
      - name: Deploy backend, provision nginx, force Firestore resync
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          # Staged swap + /api/healthz poll: if the new API does not come up the
          # script restores the previous release and this step fails. The
          # frontend below is then never published.
          ssh "$ORACLE_USER@$ORACLE_HOST" \
            "sed -i '1s/^\xEF\xBB\xBF//;s/\r$//' $REMOTE_INBOX/remote-deploy.sh && bash $REMOTE_INBOX/remote-deploy.sh backend nginx resync"
      - name: Publish frontend
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          # Staged and verified against ngsw.json, then published in place with
          # index.html / ngsw.json last; the live docroot is never wiped.
          ssh "$ORACLE_USER@$ORACLE_HOST" "bash $REMOTE_INBOX/remote-deploy.sh frontend"
