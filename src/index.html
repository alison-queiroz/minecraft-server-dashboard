<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EV Minecraft Server</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track your EV Minecraft Server — live player count, server status, and more.">
  <!-- Private dashboard: prevent search engine indexing -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph (WhatsApp, Telegram, Facebook, Discord) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EV Minecraft Server">
  <meta property="og:title" content="EV Minecraft Server Dashboard">
  <meta property="og:description" content="Track your EV Minecraft Server — live player count, server status, and more.">
  <meta property="og:url" content="https://exvegan-minecraft-server.duckdns.org/">
  <meta property="og:image" content="https://exvegan-minecraft-server.duckdns.org/assets/icons/web-app-manifest-512x512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="EV Minecraft Server Dashboard">
  <meta name="twitter:description" content="Track your EV Minecraft Server — live player count, server status, and more.">
  <meta name="twitter:image" content="https://exvegan-minecraft-server.duckdns.org/assets/icons/web-app-manifest-512x512.png">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Warm up the TLS connections the app needs on boot: Firebase Auth restores
       the session (securetoken + identitytoolkit) before the route guard runs,
       and the dashboard opens a Firestore channel. Shaves the handshake off the
       critical path, most noticeable on cold PWA launches. -->
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

  <!-- Boot splash: shown while the JS/CSS bundle downloads and Angular boots.
       An HttpInterceptor can't cover this window (Angular isn't running yet).
       Angular removes this markup automatically when it renders <app-root>. -->
  <style>
    .app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #f5f5f4; /* stone-100 */
      color: #3f3f46;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      z-index: 9999;
    }
    @media (prefers-color-scheme: dark) {
      .app-splash { background: #09090b; color: #a1a1aa; } /* zinc-950 */
    }
    .app-splash__spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(120, 120, 128, 0.25);
      border-top-color: #22c55e; /* green-500, matches the app accent */
      animation: app-splash-spin 0.8s linear infinite;
    }
    .app-splash__label { font-size: 0.85rem; letter-spacing: 0.02em; }
    @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .app-splash__spinner { animation: none; }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="app-splash">
      <div class="app-splash__spinner"></div>
      <div class="app-splash__label">Loading EV Minecraft Server…</div>
    </div>
  </app-root>
</body>
</html>
