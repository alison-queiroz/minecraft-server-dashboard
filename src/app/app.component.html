@if (loadingService.isLoading()) {
  <div class="loading-bar" aria-hidden="true">
    <div class="loading-bar-fill"></div>
  </div>
}
<div
  class="flex h-screen flex-col overflow-hidden bg-stone-100 font-sans text-zinc-900 transition-colors dark:bg-zinc-950 dark:text-zinc-100"
  [attr.data-theme]="themeService.theme()"
  appSwipeNavigate
  [appSwipeNavigatePageOrder]="pageOrder"
  (dragXChange)="onDragXChange($event)"
  (draggingChange)="onDraggingChange($event)"
  (navigateDirection)="onNavigateDirection($event)"
  (previewIndexChange)="onPreviewIndexChange($event)"
>
  <div class="px-4 md:px-8 flex-1 flex flex-col min-h-0">
    <app-nav></app-nav>
    <div class="relative flex-1 min-h-0">
      @if (previewComponentType(); as previewType) {
        <div
          class="absolute inset-0 overflow-y-auto overflow-x-hidden custom-scrollbar pointer-events-none"
          [style.transform]="previewTransform()"
          [class.swipe-spring]="!isDragging()"
        >
          <ng-container [ngComponentOutlet]="previewType"></ng-container>
        </div>
      }
      <main
        class="absolute inset-0 overflow-y-auto overflow-x-hidden custom-scrollbar"
        [style.transform]="dragX() ? 'translateX(' + dragX() + 'px)' : ''"
        [style.--enter-from-x]="enterFromX() !== null ? enterFromX() + 'px' : null"
        [class.swipe-spring]="!isDragging() && !enterFrom()"
        [class.slide-in-from-right]="enterFrom() === 'right' && enterFromX() === null"
        [class.slide-in-from-left]="enterFrom() === 'left' && enterFromX() === null"
        [class.slide-in-partial]="!!enterFrom() && enterFromX() !== null"
      >
        <router-outlet></router-outlet>
      </main>
    </div>
    <app-footer></app-footer>
  </div>
</div>
