@if (loadingService.isLoading()) {
  <div class="loading-bar" aria-hidden="true">
    <div class="loading-bar-fill"></div>
  </div>
}
<div class="app-shell"
  [attr.data-theme]="themeService.theme()"
  appSwipeNavigate
  [appSwipeNavigatePageOrder]="pageOrder"
  (dragXChange)="onDragXChange($event)"
  (draggingChange)="onDraggingChange($event)"
  (navigateDirection)="onNavigateDirection($event)">
  <div class="app-content-shell">
    <app-nav></app-nav>
    <main class="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar"
          [style.transform]="dragX() ? 'translateX(' + dragX() + 'px)' : ''"
          [class.swipe-spring]="!isDragging() && !enterFrom()"
          [class.slide-in-from-right]="enterFrom() === 'right'"
          [class.slide-in-from-left]="enterFrom() === 'left'">
      <router-outlet></router-outlet>
    </main>
    <app-footer></app-footer>
  </div>
</div>
