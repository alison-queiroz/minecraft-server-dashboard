<div class="h-screen overflow-hidden bg-zinc-950 text-zinc-100 font-sans flex flex-col"
     (touchstart)="onTouchStart($event)"
     (touchmove)="onTouchMove($event)"
     (touchend)="onTouchEnd($event)">
  <div class="px-4 md:px-8 flex-1 flex flex-col min-h-0">
    <app-nav></app-nav>
    <main class="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar"
          [style.transform]="dragX() ? 'translateX(' + dragX() + 'px)' : ''"
          [class.swipe-spring]="!isDragging() && !enterFrom()"
          [class.slide-in-from-right]="enterFrom() === 'right'"
          [class.slide-in-from-left]="enterFrom() === 'left'">
      <router-outlet></router-outlet>
    </main>
    <app-footer></app-footer>
  </div>
</div>
