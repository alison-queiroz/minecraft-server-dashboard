<div class="players-wrapper">
  <div class="players-header">
    @if (hasSelection()) {
      <button class="players-back-btn" (click)="playerService.selectedPlayerName.set(null)">
        <app-icon [icon]="LucideArrowLeft" [size]="16"></app-icon>
        Back
      </button>
    } @else {
      <app-page-header title="Players"
        [subtitle]="playerService.players().length + ' registered players'" />
    }
  </div>

  <div class="players-layout" [class.players-layout--detail-open]="hasSelection()">
    <app-player-list class="players-list-panel" [class.players-panel--hidden]="hasSelection()"></app-player-list>
    <app-player-detail class="players-detail-panel" [class.players-panel--hidden]="!hasSelection()"></app-player-detail>
  </div>
</div>
