<div class="status-page">

  <!-- Page header -->
  <div class="status-header">
    <div>
      <h1 class="status-title">Server Status</h1>
      <p class="status-subtitle">Live server information</p>
    </div>
    <a routerLink="/" class="status-back-link">
      <app-icon [icon]="LucideChevronLeft" [size]="14"></app-icon>
      Back
    </a>
  </div>

  <div class="status-grid">

    <!-- Left column: server identity -->
    <div class="status-column status-column--sidebar">
      <app-server-identity-card></app-server-identity-card>
      <app-server-players-card></app-server-players-card>
    </div>

    <!-- Right column: connection details -->
    <div class="status-column status-column--main">
      <app-server-connection-card></app-server-connection-card>
      <app-server-bedrock-card></app-server-bedrock-card>
      <app-server-details-card></app-server-details-card>
      <app-server-motd-card></app-server-motd-card>
      <app-players-cta></app-players-cta>
    </div>
  </div>
</div>
