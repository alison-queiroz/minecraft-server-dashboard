<div class="max-w-3xl mx-auto px-4 py-8 flex flex-col gap-6">

  <!-- Header -->
  <div class="flex items-center gap-4">
    @if (auth.currentUser()?.photoURL) {
      <img [src]="auth.currentUser()!.photoURL!" [alt]="auth.currentUser()!.displayName ?? 'User'"
           class="w-16 h-16 rounded-full border-2 border-zinc-700 object-cover shrink-0" />
    }
    <div>
      <h1 class="text-2xl font-black text-zinc-100">{{ auth.currentUser()?.displayName }}</h1>
      <p class="text-sm text-zinc-400">{{ auth.currentUser()?.email }}</p>
    </div>
  </div>

  <!-- Minecraft Accounts -->
  <app-profile-accounts></app-profile-accounts>

  <!-- Map Browser -->
  <app-map-viewer
    [resizable]="true"
    [navigateToHash]="mapPreviewHash()"
    (positionCaptured)="capturedMapHash.set($event)">
  </app-map-viewer>

  <!-- Saved Locations -->
  <app-profile-locations
    [capturedHash]="capturedMapHash()"
    (previewRequested)="mapPreviewHash.set($event)">
  </app-profile-locations>

</div>
