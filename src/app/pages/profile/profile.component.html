<div class="max-w-7xl mx-auto w-full pb-6">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:h-[calc(100vh-120px)]">

    <!-- Left column (desktop): flex column with scroll -->
    <!-- Mobile: contents so children participate directly in the mobile single-column stack -->
    <div class="contents lg:flex lg:flex-col lg:col-span-4 lg:gap-6 lg:overflow-y-auto lg:pr-1 custom-scrollbar">

      <div class="flex items-center gap-4 order-1">
        <app-user-avatar size="lg"></app-user-avatar>
        <div>
          <h1 class="text-2xl font-black text-zinc-100">{{ auth.currentUser()?.displayName }}</h1>
          <p class="text-sm text-zinc-400">{{ auth.currentUser()?.email }}</p>
        </div>
      </div>

      <app-profile-accounts class="order-2"></app-profile-accounts>

      <app-profile-locations class="order-4"
        [capturedHash]="capturedMapHash()"
        (previewRequested)="mapPreviewHash.set($event)">
      </app-profile-locations>

    </div>

    <!-- Map — order-3 on mobile (between accounts and locations) -->
    <div class="lg:col-span-8 lg:h-full order-3">
      <app-map-viewer
        [fillHeight]="true"
        [navigateToHash]="mapPreviewHash()"
        (positionCaptured)="capturedMapHash.set($event)">
      </app-map-viewer>
    </div>

  </div>
</div>
