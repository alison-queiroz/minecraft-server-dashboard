<div class="profile-page">

  <!-- Fullscreen map overlay -->
  @if (showMap()) {
    <div class="profile-map-overlay">
      <button class="profile-map-back" (click)="closeMap()">
        <app-icon [icon]="LucideArrowLeft" [size]="16"></app-icon>
        Back to profile
      </button>
      <div class="profile-map-fill">
        <app-map-viewer
          [fillHeight]="true"
          [navigateToHash]="mapPreviewHash()"
          (positionCaptured)="capturedMapHash.set($event)">
        </app-map-viewer>
      </div>
    </div>
  } @else {

    <!-- Header -->
    <div class="profile-header">
      <app-user-avatar size="lg"></app-user-avatar>
      <div>
        <h1 class="profile-name">{{ auth.currentUser()?.displayName }}</h1>
        <p class="profile-email">{{ auth.currentUser()?.email }}</p>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="profile-tabs">
      <button class="profile-tab" [class.profile-tab--active]="activeTab() === 'account'" (click)="setTab('account')">
        <app-icon [icon]="LucideUser" [size]="14"></app-icon>
        Account
      </button>
      @if (linkedJavaPlayer()) {
        <button class="profile-tab" [class.profile-tab--active]="activeTab() === 'advancements'" (click)="setTab('advancements')">
          <app-icon [icon]="LucideTrophy" [size]="14"></app-icon>
          Advancements
        </button>
      }
      <button class="profile-tab" [class.profile-tab--active]="activeTab() === 'locations'" (click)="setTab('locations')">
        <app-icon [icon]="LucideMapPin" [size]="14"></app-icon>
        Locations
      </button>
    </div>

    <!-- Tab panels -->
    <div class="profile-panel"
         (touchstart)="onTouchStart($event)"
         (touchend)="onTouchEnd($event)">
      @if (activeTab() === 'account') {
        <app-profile-accounts></app-profile-accounts>
      }

      @if (activeTab() === 'advancements') {
        @if (linkedJavaPlayer(); as javaPlayer) {
          <app-player-advancements
            [uuid]="javaPlayer.uuid"
            [isBedrock]="false"
            [initialCount]="javaPlayer.advancement_count">
          </app-player-advancements>
        }
      }

      @if (activeTab() === 'locations') {
        <app-profile-locations
          [capturedHash]="capturedMapHash()"
          (previewRequested)="previewMap($event)">
        </app-profile-locations>
      }
    </div>

  }
</div>
