<div class="profile-container">
  <div class="profile-grid">
    <div class="profile-sidebar">
      <div class="profile-header">
        <app-user-avatar size="lg"></app-user-avatar>
        <div>
          <h1 class="profile-name">{{ auth.currentUser()?.displayName }}</h1>
          <p class="profile-email">{{ auth.currentUser()?.email }}</p>
        </div>
      </div>

      <app-profile-accounts class="order-2"></app-profile-accounts>

      <app-profile-locations
        class="order-4"
        [capturedHash]="capturedMapHash()"
        (previewRequested)="previewMap($event)"
      >
      </app-profile-locations>
    </div>

    <div class="map-section">
      <section class="map-card">
        <button
          type="button"
          class="map-toggle-btn"
          (click)="toggleMap()"
          [attr.aria-expanded]="showMap()"
        >
          <div class="map-toggle-text">
            <span class="map-toggle-title">Map preview</span>
            <span class="map-toggle-subtitle"
              >Click to load the live map only when you need it.</span
            >
          </div>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="map-toggle-icon"
            [class.rotate-180]="showMap()"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        @if (showMap()) {
          <div class="map-viewer-wrapper">
            <app-map-viewer
              [fillHeight]="true"
              [navigateToHash]="mapPreviewHash()"
              (positionCaptured)="capturedMapHash.set($event)"
            >
            </app-map-viewer>
          </div>
        }
      </section>
    </div>
  </div>
</div>
