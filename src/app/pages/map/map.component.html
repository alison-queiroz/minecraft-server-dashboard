<div class="map-page">

  <!-- Header -->
  <div class="map-header">
    <button class="map-back-btn" (click)="location.back()">
      <app-icon [icon]="LucideArrowLeft" [size]="16"></app-icon>
      Back
    </button>
    <h1 class="map-title">
      <app-icon [icon]="LucideMap" [size]="22" class="map-title-icon"></app-icon>
      World Map
    </h1>
  </div>

  <!-- Map viewer (resizable, tall) -->
  <div class="map-viewer-card">
    <app-map-viewer
      [resizable]="true"
      [showCapture]="false"
      [navigateToHash]="navigateToHash()"
      class="map-full-height">
    </app-map-viewer>
  </div>

</div>
