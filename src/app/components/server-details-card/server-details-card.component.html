<div class="bg-zinc-900 rounded-3xl border border-zinc-800 overflow-hidden shadow-xl">
  <div class="p-5 border-b border-zinc-800">
    <h3 class="text-[10px] uppercase font-black tracking-widest text-zinc-500 flex items-center gap-2">
      <app-icon [icon]="LucideInfo" [size]="12" [strokeWidth]="2.5"></app-icon>
      Server Details
    </h3>
  </div>
  <div class="p-5 grid grid-cols-2 gap-4">
    <div>
      <p class="text-[10px] uppercase font-black tracking-widest text-zinc-600 mb-1">Software</p>
      <p class="font-bold text-zinc-200">{{ serverService.software() || '—' }}</p>
    </div>
    <div>
      <p class="text-[10px] uppercase font-black tracking-widest text-zinc-600 mb-1">Version</p>
      <p class="font-mono font-bold text-zinc-200">{{ serverService.version() || '—' }}</p>
    </div>
    <div>
      <p class="text-[10px] uppercase font-black tracking-widest text-zinc-600 mb-1">Protocol</p>
      <p class="font-mono font-bold text-zinc-200">{{ serverService.protocol()?.version ?? '—' }}</p>
    </div>
    <div>
      <p class="text-[10px] uppercase font-black tracking-widest text-zinc-600 mb-1">Edition</p>
      <p class="font-bold text-zinc-200">Java</p>
    </div>
  </div>
</div>
