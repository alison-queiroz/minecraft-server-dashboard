@if (!isBedrock) {
  <div class="adv-section">
    <app-collapsible-section label="Advancements" [icon]="LucideTrophy" accent="amber"
      [count]="displayCount() > 0 ? displayCount() : null"
      [expanded]="!collapsed()" (expandedChange)="onToggle($event)"
      testId="advancements-header" />

    @if (!collapsed()) {
      <div class="adv-body">
        @if (result().total === 0) {
          <app-empty-state message="No advancements found." size="sm" testId="advancements-empty" />
        } @else {
          <div class="adv-categories">
            @for (entry of byCategory(); track entry.key) {
              <div class="adv-category">
                <p class="adv-cat-label">{{ entry.key }}</p>
                <div class="adv-chips">
                  @for (adv of entry.value; track adv.id) {
                    <span
                      class="adv-chip"
                      [appTooltip]="adv.description ?? adv.label"
                      (mouseenter)="prefetchDescription(adv)"
                      (focus)="prefetchDescription(adv)"
                      tabindex="0"
                      [attr.aria-label]="adv.description ?? adv.label"
                    >
                      {{ adv.label }}
                    </span>
                  }
                </div>
              </div>
            }
          </div>
        }
      </div>
    }
  </div>
}
