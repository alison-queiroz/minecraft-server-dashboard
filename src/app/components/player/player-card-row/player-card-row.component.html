<div class="col-span-6 sm:col-span-4 flex items-center gap-4">
    <app-player-face [player]="player" [size]="40" [showBadge]="true"
      class="player-row-avatar">
    </app-player-face>
    <div class="flex min-w-0 flex-col">
      <!-- Keyboard entry point for the row: Enter/Space fire a native click that
           bubbles to the host (click) handler, like a mouse click anywhere on the row. -->
      <button type="button" class="player-row-name group-hover:text-emerald-400"
        [attr.aria-current]="isSelected ? 'true' : null"
        [appTooltip]="player.name">{{ player.name }}</button>
      <span class="player-row-uuid" [appTooltip]="player.uuid">{{ player.uuid }}</span>
    </div>
  </div>

  <div class="col-span-2 sm:col-span-1">
    <span class="player-row-level">
      LVL {{ player.level }}
    </span>
  </div>

  <div class="col-mobile-hidden sm:block col-span-2">
    @if ((player.play_hours ?? 0) > 0) {
      <span class="text-xs text-zinc-600 dark:text-zinc-400">{{ player.play_hours | number:'1.0-0' }}h</span>
    } @else {
      <span class="player-row-empty">&mdash;</span>
    }
  </div>

  <div class="col-span-3 sm:col-span-2 min-w-0">
    <app-dimension-tag
      class="player-row-dimension"
      [appTooltip]="player.dimension"
      [world]="player.dimension">
    </app-dimension-tag>
  </div>

  <div class="col-span-1">
    @if ((player.advancement_count ?? 0) > 0) {
      <span class="player-row-adv">{{ player.advancement_count }}</span>
    } @else {
      <span class="player-row-empty">&mdash;</span>
    }
  </div>

  <div class="col-mobile-hidden sm:block col-span-2 text-right">
    <span class="player-row-seen">{{ player.last_seen }}</span>
  </div>
