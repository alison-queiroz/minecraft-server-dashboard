<div class="player-list-card">
  <!-- Search Bar -->
  <app-player-search></app-player-search>

  <!-- Table Header (Static) -->
  <div class="player-list-header">
    <div class="col-span-5">Player</div>
    <div class="col-span-2">Level</div>
    <div class="col-span-3">Dimension</div>
    <div class="col-span-2 header-align-right">Last Seen</div>
  </div>

  <!-- Virtual Scroll Viewport -->
  <cdk-virtual-scroll-viewport itemSize="65" class="player-list-viewport custom-scrollbar">
    <app-player-card-row
      *cdkVirtualFor="let player of service.filteredPlayers(); trackBy: trackByUuid"
      [player]="player"
      [isSelected]="service.selectedPlayerName() === player.name"
      (select)="service.selectedPlayerName.set(player.name)">
    </app-player-card-row>
  </cdk-virtual-scroll-viewport>
</div>
