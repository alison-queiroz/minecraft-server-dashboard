<app-ui-card class="connect-card" [showHeader]="true">
  <h2 uiCardTitle class="connect-title">
    <app-icon [icon]="LucideWifi" [size]="12" [strokeWidth]="2.5"></app-icon>
    How to Connect
  </h2>

  <div class="connect-address-card">
    <div class="connect-copy">
      <p class="connect-label">Server Address</p>
      <code class="connect-address">
        {{ serverService.hostname() || 'exvegan.duckdns.org' }}
      </code>
    </div>
    <app-copy-button [value]="serverService.hostname() || 'exvegan.duckdns.org'"></app-copy-button>
  </div>

  <div class="connect-meta">
    <span class="connect-meta-item">
      <app-icon [icon]="LucideServer" [size]="12"></app-icon>
      Java Edition
    </span>
    <span class="connect-port">Port: {{ serverService.port() ?? 25565 }}</span>
  </div>
</app-ui-card>
