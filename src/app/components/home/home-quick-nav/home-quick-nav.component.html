<div class="flex flex-col gap-3">
  <a routerLink="/players"
    class="flex items-center gap-4 bg-zinc-900 hover:bg-zinc-800/80 rounded-2xl border border-zinc-800 hover:border-emerald-500/40 p-4 transition-all group active:scale-[0.98] shadow-lg">
    <div class="w-12 h-12 rounded-2xl bg-zinc-800 group-hover:bg-emerald-500/10 border border-zinc-700 group-hover:border-emerald-500/30 flex items-center justify-center text-zinc-500 group-hover:text-emerald-400 transition-all shrink-0">
      <app-icon [icon]="LucideUsers" [size]="20"></app-icon>
    </div>
    <div class="flex-1 min-w-0">
      <div class="font-bold text-zinc-100 group-hover:text-emerald-400 transition-colors text-sm">Player List</div>
      <div class="text-xs text-zinc-500 mt-0.5">{{ playerService.players().length }} registered players</div>
    </div>
    <app-icon [icon]="LucideChevronRight" [size]="16" [strokeWidth]="2.5" class="text-zinc-700 group-hover:text-emerald-500 transition-colors shrink-0"></app-icon>
  </a>

  <a routerLink="/server"
    class="flex items-center gap-4 bg-zinc-900 hover:bg-zinc-800/80 rounded-2xl border border-zinc-800 hover:border-emerald-500/40 p-4 transition-all group active:scale-[0.98] shadow-lg">
    <div class="w-12 h-12 rounded-2xl bg-zinc-800 group-hover:bg-emerald-500/10 border border-zinc-700 group-hover:border-emerald-500/30 flex items-center justify-center text-zinc-500 group-hover:text-emerald-400 transition-all shrink-0">
      <app-icon [icon]="LucideServer" [size]="20"></app-icon>
    </div>
    <div class="flex-1 min-w-0">
      <div class="font-bold text-zinc-100 group-hover:text-emerald-400 transition-colors text-sm">Server Status</div>
      <div class="text-xs text-zinc-500 mt-0.5">Detailed server information</div>
    </div>
    <app-icon [icon]="LucideChevronRight" [size]="16" [strokeWidth]="2.5" class="text-zinc-700 group-hover:text-emerald-500 transition-colors shrink-0"></app-icon>
  </a>
</div>
