<div class="bg-zinc-900 rounded-3xl border border-zinc-800 p-6 shadow-xl">
  <h2 class="text-[10px] uppercase font-black tracking-widest text-zinc-500 mb-5 flex items-center gap-2">
    <app-icon [icon]="LucideWifi" [size]="12" [strokeWidth]="2.5"></app-icon>
    How to Connect
  </h2>

  <div class="bg-zinc-950 rounded-2xl border border-zinc-800 p-4 flex items-center gap-3 mb-4 hover:border-zinc-700 transition-colors">
    <div class="flex-1 min-w-0">
      <p class="text-[10px] uppercase font-black tracking-widest text-zinc-600 mb-1">Server Address</p>
      <code class="font-mono text-emerald-400 text-sm block truncate">
        {{ serverService.hostname() || 'exvegan.duckdns.org' }}
      </code>
    </div>
    <button (click)="copyAddress()"
      class="shrink-0 px-4 py-2 text-xs font-black uppercase tracking-widest rounded-xl border transition-all active:scale-95"
      [ngClass]="copied()
        ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30'
        : 'text-zinc-400 bg-zinc-800 border-zinc-700 hover:text-zinc-100 hover:bg-zinc-700'">
      {{ copied() ? 'Copied!' : 'Copy' }}
    </button>
  </div>

  <div class="flex items-center justify-between text-xs text-zinc-600 px-1">
    <span class="flex items-center gap-2">
      <app-icon [icon]="LucideServer" [size]="12"></app-icon>
      Java Edition
    </span>
    <span class="font-mono">Port: {{ serverService.port() ?? 25565 }}</span>
  </div>
</div>
