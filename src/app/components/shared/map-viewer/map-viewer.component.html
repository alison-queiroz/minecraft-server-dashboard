<div class="map-viewer-shell" [class.map-viewer-shell--fill]="fillHeight">
  <div [class.resize-handle]="resizable" [class.fill-handle]="fillHeight">
    <iframe
      #mapIframe
      [src]="mapSrc()"
      class="map-frame"
      [style.height]="resizable || fillHeight ? '100%' : '320px'"
      loading="lazy"
      title="Minecraft Map"
      (load)="onIframeLoad()"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
    </iframe>
  </div>
  @if (showCapture) {
  <div class="map-tools">
    <p class="map-tools-copy">
      Navigate to a spot on the map, then click <strong class="map-tools-strong">Capture position</strong>
      to save your current view as a location.
    </p>
    <div class="map-tools-actions">
      <button (click)="capturePosition()"
        class="map-capture-button">
        <app-icon [icon]="LucideMapPin" [size]="12"></app-icon>
        Capture position
      </button>
    </div>
    @if (showCaptureInput()) {
      <div class="map-capture-row">
        <input [value]="captureInput()"
               (input)="captureInput.set($any($event.target).value)"
               placeholder="Paste map URL here..."
               class="ui-input ui-input--mono map-capture-input" />
        <button (click)="applyCapturedUrl()"
          class="map-capture-apply">
          Use
        </button>
      </div>
    }
  </div>
  }
</div>
