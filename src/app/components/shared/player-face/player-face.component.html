@if (useRawSkin()) {
  <div
    class="w-full h-full bg-no-repeat"
    style="background-size: 800%"
    [style.background-image]="'url(' + rawSkinUrl() + ')'"
    [style.background-position]="bgPosition()"
  ></div>
} @else {
  <img [src]="avatarSrc()" class="w-full h-full object-cover" alt="" />
}

@if (player().isBedrock() && showBadge()) {
  <span class="player-face-bedrock-badge">BEDROCK</span>
}
