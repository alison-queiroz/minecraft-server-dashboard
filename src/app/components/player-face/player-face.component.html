@if (player().isRawAvatar()) {
  <div class="w-full h-full bg-no-repeat"
    style="background-size: 800%"
    [style.background-image]="'url(' + player().avatarUrl() + ')'"
    [style.background-position]="bgPosition()">
  </div>
} @else {
  <img [src]="avatarSrc()" class="w-full h-full object-cover" alt="" />
}

@if (player().isBedrock() && showBadge()) {
  <span class="absolute -bottom-1 -right-1 bg-blue-600 text-[8px] font-black px-1 rounded border border-blue-400 z-10">BEDROCK</span>
}
