<div class="p-4 border-b border-zinc-800 flex flex-col md:flex-row gap-4 items-center bg-zinc-900/50">
  <div class="relative w-full">
    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
      </svg>
    </span>
    <input
      type="text"
      [ngModel]="service.searchTerm()"
      (ngModelChange)="service.searchTerm.set($event)"
      placeholder="Search by name, UUID or dimension..."
      class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all placeholder:text-zinc-700"
    />
  </div>
  <div class="flex items-center gap-2 whitespace-nowrap text-xs font-bold text-zinc-500">
    <span>Showing {{ service.filteredPlayers().length }} of {{ service.players().length }}</span>
  </div>
</div>
