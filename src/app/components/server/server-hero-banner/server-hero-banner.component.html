<div class="hero-banner">
  <div class="hero-grid"></div>

  <div class="hero-content">
    <app-server-icon size="home"></app-server-icon>

    <div class="hero-copy">
      <div class="hero-title-row">
        <h1 class="hero-title">ExVegan</h1>
        <app-server-status-badge></app-server-status-badge>
      </div>

      @if (serverService.motd().length > 0) {
        <p class="hero-motd">{{ serverService.motd()[0] }}</p>
      }

      <div class="hero-tags">
        @if (serverService.software()) {
          <app-ui-badge variant="success" appearance="soft">{{ serverService.software() }}</app-ui-badge>
        }
        @if (serverService.version()) {
          <app-ui-badge variant="neutral" appearance="soft">v{{ serverService.version() }}</app-ui-badge>
        }
        @if (serverService.hostname()) {
          <app-ui-badge variant="info" appearance="soft">{{ serverService.hostname() }}</app-ui-badge>
        }
      </div>
    </div>
  </div>
</div>
