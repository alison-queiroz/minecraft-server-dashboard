<app-ui-card class="bedrock-card" [showHeader]="true">
  <h3 uiCardTitle class="server-card-title">
    <app-icon [icon]="LucideGrid3x3" [size]="12" [strokeWidth]="2.5"></app-icon>
    Bedrock Edition
    <app-ui-badge [variant]="bedrockStatusVariant()" appearance="soft" size="sm">
      {{ serverService.bedrockStatus() }}
    </app-ui-badge>
  </h3>
  <span uiCardActions class="bedrock-via">via Geyser</span>
  <div class="bedrock-body">
    <div class="bedrock-grid">
      <app-ui-stat-item [label]="'Port'" [value]="serverService.bedrockPort() ?? 19132" [mono]="true"></app-ui-stat-item>
      <app-ui-stat-item [label]="'Version'" [value]="serverService.bedrockVersion() || '—'" [mono]="true"></app-ui-stat-item>
      <app-ui-stat-item [label]="'Online'">
        <span uiStatValue class="bedrock-online"
          [class.text-blue-400]="serverService.bedrockOnlinePlayers() > 0"
          [class.text-zinc-500]="serverService.bedrockOnlinePlayers() === 0">
          {{ serverService.bedrockOnlinePlayers() }}<span class="bedrock-online-max">/{{ serverService.bedrockMaxPlayers() }}</span>
        </span>
      </app-ui-stat-item>
      <app-ui-stat-item [label]="'Edition'" [value]="'Bedrock'"></app-ui-stat-item>
    </div>
    <div class="bedrock-note">
      <app-icon [icon]="LucideInfo" [size]="12" class="bedrock-note-icon"></app-icon>
      <p class="bedrock-note-copy">
        <span class="bedrock-note-text">Mobile (iOS / Android) and console players connect via Bedrock on port&nbsp;</span>
        <code class="bedrock-note-port">{{ serverService.bedrockPort() ?? 19132 }}</code>
      </p>
    </div>
  </div>
</app-ui-card>
