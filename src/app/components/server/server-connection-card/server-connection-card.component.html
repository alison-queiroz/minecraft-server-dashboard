<div class="connection-card ui-panel--elevated overflow-hidden">
  <div class="server-card-header">
    <h3 class="server-card-title">
      <app-icon [icon]="LucideWifi" [size]="12" [strokeWidth]="2.5"></app-icon>
      Connection Details
    </h3>
  </div>
  <div class="connection-list">
    <!-- Hostname -->
    <div class="connection-row">
      <div class="connection-info">
        <div class="connection-icon-box">
          <app-icon [icon]="LucideGlobe" [size]="16"></app-icon>
        </div>
        <div>
          <p class="card-label mb-0.5">Hostname</p>
          <code class="connection-value connection-value--accent">{{ serverService.hostname() || 'exvegan.duckdns.org' }}</code>
        </div>
      </div>
      <app-copy-button [value]="serverService.hostname() || 'exvegan.duckdns.org'"></app-copy-button>
    </div>
    <!-- IP -->
    @if (serverService.ip()) {
      <div class="connection-row">
        <div class="connection-info">
          <div class="connection-icon-box">
            <app-icon [icon]="LucideServer" [size]="16"></app-icon>
          </div>
          <div>
            <p class="card-label mb-0.5">IP Address</p>
            <code class="connection-value">{{ serverService.ip() }}</code>
          </div>
        </div>
        <app-copy-button [value]="serverService.ip() || ''"></app-copy-button>
      </div>
    }
    <!-- Port -->
    <div class="connection-row connection-row--compact">
      <div class="connection-info">
        <div class="connection-icon-box">
          <app-icon [icon]="LucideHash" [size]="16"></app-icon>
        </div>
        <div>
          <p class="card-label mb-0.5">Port</p>
          <code class="connection-value">{{ serverService.port() ?? 25565 }}</code>
        </div>
      </div>
    </div>
  </div>
</div>
