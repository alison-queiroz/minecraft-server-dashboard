<a routerLink="/players"
  class="flex items-center gap-4 bg-emerald-600 hover:bg-emerald-500 rounded-2xl p-5 transition-all group active:scale-[0.98] shadow-lg shadow-emerald-900/30 border border-emerald-500">
  <app-icon [icon]="LucideUsers" [size]="22" class="text-white shrink-0"></app-icon>
  <div class="flex-1">
    <p class="font-black text-white text-sm uppercase tracking-wide">Browse Player List</p>
    <p class="text-emerald-200/70 text-xs mt-0.5">{{ playerService.players().length }} registered players</p>
  </div>
  <app-icon [icon]="LucideChevronRight" [size]="18" [strokeWidth]="2.5" class="text-white/70 shrink-0"></app-icon>
</a>
