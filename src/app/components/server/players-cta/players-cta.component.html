<a routerLink="/players" class="players-cta-link group">
  <app-icon [icon]="LucideUsers" [size]="22" class="players-cta-icon"></app-icon>
  <div class="players-cta-copy">
    <p class="players-cta-title">Browse Player List</p>
    <p class="players-cta-subtitle">{{ playerService.players().length }} registered players</p>
  </div>
  <app-icon [icon]="LucideChevronRight" [size]="18" [strokeWidth]="2.5" class="players-cta-arrow"></app-icon>
</a>
