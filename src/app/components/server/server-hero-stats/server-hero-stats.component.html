<div class="border-t border-zinc-800 grid grid-cols-2 sm:grid-cols-5">
  <div class="p-5 text-center border-r border-zinc-800">
    <span class="block text-3xl font-black font-mono leading-none"
      [class.text-emerald-400]="serverService.onlinePlayers() > 0"
      [class.text-zinc-500]="serverService.onlinePlayers() === 0">{{ serverService.onlinePlayers() }}</span>
    <span class="block text-[10px] uppercase font-black tracking-widest text-zinc-500 mt-2">Java Online</span>
  </div>
  <div class="p-5 text-center border-r border-zinc-800">
    <span class="block text-3xl font-black font-mono leading-none"
      [class.text-blue-400]="serverService.bedrockOnlinePlayers() > 0"
      [class.text-zinc-500]="serverService.bedrockOnlinePlayers() === 0">{{ serverService.bedrockOnlinePlayers() }}</span>
    <span class="block text-[10px] uppercase font-black tracking-widest text-zinc-500 mt-2">Bedrock Online</span>
  </div>
  <div class="p-5 text-center border-r border-zinc-800 sm:border-r">
    <span class="block text-3xl font-black font-mono text-zinc-400 leading-none">{{ serverService.maxPlayers() }}</span>
    <span class="block text-[10px] uppercase font-black tracking-widest text-zinc-500 mt-2">Max Players</span>
  </div>
  <div class="p-5 text-center border-t sm:border-t-0 border-r border-zinc-800">
    <span class="block text-3xl font-black font-mono text-zinc-300 leading-none">{{ playerService.players().length }}</span>
    <span class="block text-[10px] uppercase font-black tracking-widest text-zinc-500 mt-2">Registered</span>
  </div>
  <div class="p-5 text-center border-t sm:border-t-0 border-zinc-800">
    <span class="block text-base font-black font-mono text-zinc-300 leading-none truncate">
      {{ serverService.version() || '—' }}
    </span>
    <span class="block text-[10px] uppercase font-black tracking-widest text-zinc-500 mt-2">Version</span>
  </div>
</div>
