<div class="hero-stats-grid">
  <div class="hero-stat-cell hero-stat-cell--right-border">
    <app-ui-stat-item [label]="'Java Online'">
      <span uiStatValue class="hero-stat-value"
        [class.text-emerald-400]="serverService.onlinePlayers() > 0"
        [class.text-zinc-500]="serverService.onlinePlayers() === 0">{{ serverService.onlinePlayers() }}</span>
    </app-ui-stat-item>
  </div>
  <div class="hero-stat-cell hero-stat-cell--right-border">
    <app-ui-stat-item [label]="'Bedrock Online'">
      <span uiStatValue class="hero-stat-value"
        [class.text-blue-400]="serverService.bedrockOnlinePlayers() > 0"
        [class.text-zinc-500]="serverService.bedrockOnlinePlayers() === 0">{{ serverService.bedrockOnlinePlayers() }}</span>
    </app-ui-stat-item>
  </div>
  <div class="hero-stat-cell hero-stat-cell--right-border">
    <app-ui-stat-item [label]="'Max Players'">
      <span uiStatValue class="hero-stat-value text-zinc-700 dark:text-zinc-400">{{ serverService.maxPlayers() }}</span>
    </app-ui-stat-item>
  </div>
  <div class="hero-stat-cell hero-stat-cell--top-border hero-stat-cell--right-border hero-stat-cell--no-top-border-sm">
    <app-ui-stat-item [label]="'Registered'">
      <span uiStatValue class="hero-stat-value text-zinc-700 dark:text-zinc-300">{{ playerService.players().length }}</span>
    </app-ui-stat-item>
  </div>
  <div class="hero-stat-cell hero-stat-cell--top-border hero-stat-cell--no-top-border-sm col-span-2 sm:col-span-1">
    <app-ui-stat-item [label]="'Version'" [mono]="true">
      <span uiStatValue class="hero-stat-version">
        {{ serverService.version() || '—' }}
      </span>
    </app-ui-stat-item>
  </div>
</div>
