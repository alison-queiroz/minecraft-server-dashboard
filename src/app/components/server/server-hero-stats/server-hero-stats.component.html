<div class="hero-stats-grid">
  <div class="hero-stat-cell hero-stat-cell--right-border">
    <span class="hero-stat-value"
      [class.text-emerald-400]="serverService.onlinePlayers() > 0"
      [class.text-zinc-500]="serverService.onlinePlayers() === 0">{{ serverService.onlinePlayers() }}</span>
    <span class="hero-stat-label">Java Online</span>
  </div>
  <div class="hero-stat-cell hero-stat-cell--right-border">
    <span class="hero-stat-value"
      [class.text-blue-400]="serverService.bedrockOnlinePlayers() > 0"
      [class.text-zinc-500]="serverService.bedrockOnlinePlayers() === 0">{{ serverService.bedrockOnlinePlayers() }}</span>
    <span class="hero-stat-label">Bedrock Online</span>
  </div>
  <div class="hero-stat-cell hero-stat-cell--right-border">
    <span class="hero-stat-value text-zinc-400">{{ serverService.maxPlayers() }}</span>
    <span class="hero-stat-label">Max Players</span>
  </div>
  <div class="hero-stat-cell hero-stat-cell--top-border hero-stat-cell--right-border hero-stat-cell--no-top-border-sm">
    <span class="hero-stat-value text-zinc-300">{{ playerService.players().length }}</span>
    <span class="hero-stat-label">Registered</span>
  </div>
  <div class="hero-stat-cell hero-stat-cell--top-border hero-stat-cell--no-top-border-sm">
    <span class="hero-stat-version">
      {{ serverService.version() || '—' }}
    </span>
    <span class="hero-stat-label">Version</span>
  </div>
</div>
