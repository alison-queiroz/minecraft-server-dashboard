<app-ui-card class="identity-card" [showFooter]="true">
  <div class="identity-hero">
    <!-- Icon -->
    <app-server-icon size="card"></app-server-icon>
    <!-- Status badge -->
    <app-server-status-badge size="lg"></app-server-status-badge>
    @if (serverService.motd().length > 0) {
      <p class="identity-motd">{{ serverService.motd()[0] }}</p>
    }
  </div>
  <!-- Tags -->
  <div uiCardFooter class="identity-tags">
    @if (serverService.software()) {
      <app-ui-badge variant="success" appearance="soft">{{ serverService.software() }}</app-ui-badge>
    }
    @if (serverService.version()) {
      <app-ui-badge variant="neutral" appearance="soft">{{ serverService.version() }}</app-ui-badge>
    }
    @if (serverService.protocol()) {
      <app-ui-badge variant="info" appearance="soft">Protocol {{ serverService.protocol()!.version }}</app-ui-badge>
    }
  </div>
</app-ui-card>
