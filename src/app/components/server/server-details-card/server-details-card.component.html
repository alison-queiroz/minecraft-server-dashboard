<div class="details-card ui-panel--elevated overflow-hidden">
  <div class="server-card-header">
    <h3 class="server-card-title">
      <app-icon [icon]="LucideInfo" [size]="12" [strokeWidth]="2.5"></app-icon>
      Server Details
    </h3>
  </div>
  <div class="details-grid">
    <div>
      <p class="card-label mb-1">Software</p>
      <p class="details-value">{{ serverService.software() || '—' }}</p>
    </div>
    <div>
      <p class="card-label mb-1">Version</p>
      <p class="details-value details-value--mono">{{ serverService.version() || '—' }}</p>
    </div>
    <div>
      <p class="card-label mb-1">Protocol</p>
      <p class="details-value details-value--mono">{{ serverService.protocol()?.version ?? '—' }}</p>
    </div>
    <div>
      <p class="card-label mb-1">Edition</p>
      <p class="details-value">Java</p>
    </div>
  </div>
</div>
