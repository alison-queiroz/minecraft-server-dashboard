<app-ui-card class="details-card" [showHeader]="true">
  <h3 uiCardTitle class="server-card-title">
    <app-icon [icon]="LucideInfo" [size]="12" [strokeWidth]="2.5"></app-icon>
    Server Details
  </h3>
  <div class="details-grid">
    <app-ui-stat-item [label]="'Software'" [value]="serverService.software() || '—'"></app-ui-stat-item>
    <app-ui-stat-item [label]="'Version'" [value]="serverService.version() || '—'" [mono]="true"></app-ui-stat-item>
    <app-ui-stat-item [label]="'Protocol'" [value]="serverService.protocol()?.version ?? '—'" [mono]="true"></app-ui-stat-item>
    <app-ui-stat-item [label]="'Edition'" [value]="'Java'"></app-ui-stat-item>
  </div>
</app-ui-card>
