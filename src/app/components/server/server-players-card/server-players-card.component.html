<div class="bg-zinc-900 rounded-3xl border border-zinc-800 p-5 shadow-xl">
  <h3 class="text-[10px] uppercase font-black tracking-widest text-zinc-500 mb-4 flex items-center gap-2">
    <app-icon [icon]="LucideUsers" [size]="12" [strokeWidth]="2.5"></app-icon>
    Players
  </h3>
  <div class="flex items-baseline gap-2 mb-3">
    <span class="text-4xl font-black font-mono"
      [class.text-emerald-400]="serverService.onlinePlayers() > 0"
      [class.text-zinc-500]="serverService.onlinePlayers() === 0">
      {{ serverService.onlinePlayers() }}
    </span>
    <span class="text-zinc-600 font-bold text-lg">/ {{ serverService.maxPlayers() }}</span>
    <span class="text-xs text-zinc-600 uppercase font-black tracking-widest ml-1">online</span>
  </div>
  <div class="bg-zinc-800 rounded-full h-2.5 overflow-hidden border border-zinc-700">
    <div class="h-full rounded-full transition-all duration-700 shadow-[0_0_8px_rgba(16,185,129,0.5)]"
      [style.width.%]="playersPercent"
      [class.bg-emerald-500]="serverService.onlinePlayers() > 0"
      [class.bg-zinc-700]="serverService.onlinePlayers() === 0">
    </div>
  </div>
  <p class="text-[10px] text-zinc-600 font-mono mt-2 text-right">
    {{ playerService.players().length }} registered total
  </p>
</div>
